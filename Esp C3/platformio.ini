; Seed Drill Field Simulator controller, ESP32-S3.
; The partition table needs an 8 MB (or larger) flash module.
[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 8MB
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++14
  -Wall
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=2
lib_ldf_mode = chain

[env:esp32s3_bench]
; Boots into simulated drive with interlocks forced healthy, for testing the display
; and cloud on a bare ESP32-S3. Never flash this onto a machine.
extends = env:esp32s3
build_flags =
  ${env:esp32s3.build_flags}
  -DSD_BENCH=1
