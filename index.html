<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1311">
<title>Seed Drill Monitor</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
/* Painted before any JavaScript arrives, so the first frame is the app, not a white page. */
html,body{margin:0;background:#0c1311;color:#eef4f0;font:16px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#boot{display:flex;flex-direction:column;gap:12px;padding:16px;max-width:560px;margin:0 auto}
#boot i{display:block;height:72px;border-radius:16px;background:#17221e}
#boot i:first-child{height:44px;width:60%}
#boot i:nth-child(2){height:240px}
</style>
</head>
<body>
<div id="root"><div id="boot"><i></i><i></i><i></i><i></i></div></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
