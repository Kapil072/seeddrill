; Seed Drill Field Simulator controller, ESP32 Dev Module (classic ESP32, 38-pin).
; NOTE: the partition table requires 8 MB flash. Most ESP32 Dev Modules ship with
; 4 MB. Check your module: if yours is 4 MB you must simplify partitions.csv first.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
platform_packages =
  framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/2.0.17/esp32-2.0.17.zip
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 4MB
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++14
  -Wall
  -DCORE_DEBUG_LEVEL=2
lib_ldf_mode = chain

[env:esp32dev_bench]
; Boots into simulated drive with interlocks forced healthy, for testing the display
; and cloud on a bare ESP32 Dev Module. Never flash this onto a machine.
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DSD_BENCH=1
