AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Seed Drill Field Simulator - IoT ingest, history API, auth and dashboard hosting

Parameters:
  RetentionDays:
    Type: Number
    Default: 400
    Description: Days to keep test records. The requirement is at least 12 months.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 15
    Environment:
      Variables:
        TABLE: !Ref Data
        RETENTION_DAYS: !Ref RetentionDays

Resources:
  # All records live in one on-demand table. DynamoDB TTL enforces retention.
  Data:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: pk, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: pk, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  IngestFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: ingest.handler
      Policies:
        - DynamoDBWritePolicy: { TableName: !Ref Data }

  # Everything a device publishes, except the commands sent to it.
  IngestRule:
    Type: AWS::IoT::TopicRule
    Properties:
      TopicRulePayload:
        AwsIotSqlVersion: '2016-03-23'
        RuleDisabled: false
        Sql: "SELECT *, topic(2) AS thing, topic(3) AS kind FROM 'seeddrill/+/+' WHERE topic(3) <> 'cmd'"
        Actions:
          - Lambda: { FunctionArn: !GetAtt IngestFn.Arn }

  IngestPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref IngestFn
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt IngestRule.Arn

  # A device can only use its own client id and its own topics.
  DevicePolicy:
    Type: AWS::IoT::Policy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: iot:Connect
            Resource: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:client/${!iot:Connection.Thing.ThingName}'
          - Effect: Allow
            Action: [iot:Publish, iot:RetainPublish]
            Resource: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/seeddrill/${!iot:Connection.Thing.ThingName}/*'
          - Effect: Deny
            Action: iot:Publish
            Resource: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/seeddrill/${!iot:Connection.Thing.ThingName}/cmd'
          - Effect: Allow
            Action: iot:Subscribe
            Resource: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topicfilter/seeddrill/${!iot:Connection.Thing.ThingName}/cmd'
          - Effect: Allow
            Action: iot:Receive
            Resource: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/seeddrill/${!iot:Connection.Thing.ThingName}/cmd'

  Users:
    Type: AWS::Cognito::UserPool
    Properties:
      AdminCreateUserConfig: { AllowAdminCreateUserOnly: true }
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy: { MinimumLength: 10, RequireNumbers: true, RequireUppercase: true, RequireLowercase: true, RequireSymbols: false }

  UsersClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref Users
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      GenerateSecret: false
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits: { IdToken: minutes, AccessToken: minutes, RefreshToken: days }

  # Members of this group may start and stop machines; everyone else is read-only.
  OperatorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: operator
      UserPoolId: !Ref Users

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 3600
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${Users}'
              audience: [!Ref UsersClient]

  ApiFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: api.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref Data }
        - Statement:
            - Effect: Allow
              Action: iot:Publish
              Resource: !Sub 'arn:aws:iot:${AWS::Region}:${AWS::AccountId}:topic/seeddrill/*/cmd'
      Events:
        All:
          Type: HttpApi
          Properties: { ApiId: !Ref Api, Path: '/{proxy+}', Method: ANY }

  Site:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SitePolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Site
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${Site.Arn}/*'
            Condition:
              StringEquals: { 'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${Cdn}' }

  Cdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt Site.RegionalDomainName
            OriginAccessControlId: !Ref SiteAccess
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # AWS managed CachingOptimized
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html }

Outputs:
  ApiUrl: { Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com' }
  UserPoolId: { Value: !Ref Users }
  UserPoolClientId: { Value: !Ref UsersClient }
  DashboardUrl: { Value: !Sub 'https://${Cdn.DomainName}' }
  SiteBucket: { Value: !Ref Site }
  CdnId: { Value: !Ref Cdn }
  DevicePolicyName: { Value: !Ref DevicePolicy }
